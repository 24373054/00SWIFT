name: Production migrations

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/scripts/verify_migration_baseline.py"
      - "backend/scripts/verify_production_schema.py"
      - "docs/database/MIGRATION_BASELINE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swift_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swift_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify immutable baseline hashes
        run: python backend/scripts/verify_migration_baseline.py
      - name: Upgrade schema
        working-directory: backend
        env:
          DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/swift_ci
        run: |
          python scripts/migration_roundtrip.py
          python scripts/verify_production_schema.py
