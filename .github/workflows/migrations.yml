name: Production migrations

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/scripts/verify_migration_baseline.py"
      - "backend/scripts/verify_production_schema.py"
      - "docs/database/MIGRATION_BASELINE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install migration dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify immutable baseline hashes
        run: python backend/scripts/verify_migration_baseline.py
      - name: Upgrade schema
        working-directory: backend
        env:
          DB_URL: sqlite:///migration_ci.db
        run: |
          python -m alembic upgrade head
          python scripts/verify_production_schema.py
